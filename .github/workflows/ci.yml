name: basic-checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The system Python of the supported Raspberry Pi OS releases:
        # 3.11 = Debian 12 (Bookworm), 3.13 = Debian 13 (Trixie).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history and tags, so builds report the version (git describe)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Version from the git tag (not "unknown")
        run: |
          v=$(python -c "import gps_time_pi; print(gps_time_pi.__version__)")
          echo "version: $v"
          if [ "$v" = "unknown" ]; then echo "::error::no reachable v* tag; checkout needs fetch-depth: 0"; exit 1; fi
      - name: Compile Python
        run: python -m compileall gps_time_pi tools tests modules coordinator
      - name: Hardware config generator smoke test
        run: python tools/generate_config.py --help
      - name: Unit and packaging regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Runtime dependencies install and import on this Python (as install.sh does, in a venv)
        run: |
          python -m venv "$RUNNER_TEMP/station-venv"
          "$RUNNER_TEMP/station-venv/bin/python" -m pip install --quiet --disable-pip-version-check -r requirements.txt
          "$RUNNER_TEMP/station-venv/bin/python" -c "import numpy, skyfield; from skyfield.api import load; load.timescale(builtin=True); print('numpy', numpy.__version__, 'skyfield', skyfield.__version__)"
          # The offline time-zone lookup, through the station's own module (US Naval Observatory example).
          "$RUNNER_TEMP/station-venv/bin/python" -c "from gps_time_pi import localtime as lt; assert lt.LOOKUP['available'], lt.LOOKUP; z = lt.display_zone({'location_display': 'exact'}, {'lat': 38.9217, 'lon': -77.0669}); print(z); assert (z['tz'], z['source']) == ('America/New_York', 'position'), z; assert lt.display_zone({'location_display': 'hidden'}, {'lat': 38.9217, 'lon': -77.0669})['tz'] is None"
      - name: Satellite layer with the real sgp4 (the plain run above skips these tests)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/station-venv/bin/python" -c "from gps_time_pi import satellites as s; assert s.SGP4['available'], s.SGP4"
          "$RUNNER_TEMP/station-venv/bin/python" -m unittest tests.test_satellites tests.test_shadow 2>&1 | tee "$RUNNER_TEMP/sat-tests.txt"
          if grep -q "skipped" "$RUNNER_TEMP/sat-tests.txt"; then echo "::error::satellite tests were skipped in the station venv"; exit 1; fi
      - name: Station key with the real cryptography (the plain run above skips these tests)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/station-venv/bin/python" -m unittest tests.test_station_key -v 2>&1 | tee "$RUNNER_TEMP/key-tests.txt"
          if grep -q "skipped" "$RUNNER_TEMP/key-tests.txt"; then echo "::error::station key tests were skipped in the station venv"; exit 1; fi
      - name: Station migration with the real cryptography (the plain run above skips these tests)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/station-venv/bin/python" -m unittest tests.test_migrate -v 2>&1 | tee "$RUNNER_TEMP/migrate-tests.txt"
          if grep -q "skipped" "$RUNNER_TEMP/migrate-tests.txt"; then echo "::error::migration tests were skipped in the station venv"; exit 1; fi
      - name: Clip recording with numpy (the plain run above skips the audio test)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/station-venv/bin/python" -m unittest tests.test_clips -v 2>&1 | tee "$RUNNER_TEMP/clip-tests.txt"
          if grep -q "skipped" "$RUNNER_TEMP/clip-tests.txt"; then echo "::error::clip tests were skipped in the station venv"; exit 1; fi
      - name: Coordinator skeleton with the real cryptography (the plain run above skips its signature tests)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/station-venv/bin/python" -m unittest tests.test_coordinator -v 2>&1 | tee "$RUNNER_TEMP/coord-tests.txt"
          if grep -q "skipped" "$RUNNER_TEMP/coord-tests.txt"; then echo "::error::coordinator tests were skipped in the station venv"; exit 1; fi
      - name: Module tests that need numpy (the plain run above skips them)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/station-venv/bin/python" -m unittest tests.test_modules -v 2>&1 | tee "$RUNNER_TEMP/mod-tests.txt"
          if grep -E "skipped .numpy is needed" "$RUNNER_TEMP/mod-tests.txt"; then echo "::error::module tests that need numpy were skipped in the station venv"; exit 1; fi
      - name: Runtime dependencies have wheels for the Pi (aarch64) on this Python
        run: |
          # Wheels only: the station must never need a compiler. glibc: Bookworm 2.36, Trixie 2.41.
          abi=$(python -c "import sys; print(f'cp{sys.version_info[0]}{sys.version_info[1]}')")
          python -m pip download --quiet --disable-pip-version-check -r requirements.txt \
            --only-binary=:all: --implementation cp --python-version "${{ matrix.python-version }}" --abi "$abi" --abi abi3 --abi none \
            --platform manylinux_2_28_aarch64 --platform manylinux_2_17_aarch64 --platform manylinux2014_aarch64 \
            -d "$RUNNER_TEMP/aarch64-wheels"
          ls "$RUNNER_TEMP/aarch64-wheels"
      - name: Workflow actions pinned to full commit SHAs
        run: |
          if grep -rEn "^\s*-?\s*uses:" .github/workflows | grep -Ev "uses:\s*[^@[:space:]]+@[0-9a-f]{40}(\s|$)"; then
            echo "::error::pin every action to a 40-character commit SHA (keep the version as a trailing comment)"; exit 1
          fi

  workflows:
    # Lints every workflow file. If web.yml is invalid, GitHub runs none of it,
    # so the error only shows up here. An invalid ci.yml shows as a failed run
    # with no jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (invalid workflow files fail here)
        env:
          # Pinned binary, checked against the release's checksums file. Dependabot doesn't track it; bump both together.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
