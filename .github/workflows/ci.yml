name: basic-checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall gps_time_pi tools
      - name: Hardware config generator smoke test
        run: python tools/generate_config.py --help
      - name: Unit and packaging regression tests
        run: python -m unittest discover -s tests -t . -v
