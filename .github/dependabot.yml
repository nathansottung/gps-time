# Weekly dependency updates. Dependabot opens PRs only; nothing merges without CI and the owner.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm   # pnpm is detected from web/pnpm-lock.yaml
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node the web toolchain runs on (22: web/.mise.toml, web.yml),
      # not the newest Node. Raise it by hand when that Node changes. Minor/patch still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
