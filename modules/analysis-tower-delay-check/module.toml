# Module manifest (format: docs/modules/README.md; schema: schemas/manifest.v1.json).
# Off by default. An analysis: the host runs only source entries, so this one runs from its CLI:
#   cd modules/analysis-tower-delay-check && python -m tower_delay_check demo

name = "analysis-tower-delay-check"
version = "0.1.0"
types = ["analysis"]
maturity = "research"
summary = "Measured against predicted tower delays: finds each tower's known waveform in a PPS-marker-timed capture and compares the delay with reference-broadcast-towers' prediction (synthetic data only so far)"
spec = "docs/specs/SPEC-EXTENSIBILITY.md"
interface = "1.0"

[entry]
analysis = "tower_delay_check.check:TowerDelayCheck"

[hardware]
required = "none for the synthetic scenarios; real use needs an SDR capture timed by sdr-pps-marker (research step 2 onwards)"
planned = "an SDR source writing marker-timed observation files"

[timing]
needed = "sub-µs"
if_worse = "the capture's own sample-time uncertainty and the station's clock bound are carried into each residual's sigma; a worse clock widens them, it never hides a disagreement"

[limits]
memory_mib = 256
cpu_percent = 50

[permissions]
network = false
devices = []
storage = "none"

[config]
mode = { type = "string", default = "common_offset", description = "absolute (emission times known) or common_offset (one unknown offset shared by the towers)" }
search_s = { type = "float", unit = "s", default = 2e-5, description = "search half-width around the nominal arrival" }
min_snr = { type = "float", default = 25.0, description = "correlation peak power over its median floor needed to call a tower detected" }
z_max = { type = "float", default = 3.0, description = "|residual| / sigma above this is a disagreement" }

[emits]
streams = ["transmitter", "detected", "verdict", "predicted_delay_s", "snr", "arrival_utc_ns", "measured_delay_s", "residual_s",
           "residual_after_offset_s", "residual_tested_s", "z", "mode", "towers", "overall", "chi2", "dof",
           "blanked_marker_samples", "time_offset_bound_s", "common_offset_s", "residual_rms_s"]
events = []
schema_version = "result/1"

[licence]
code = "MIT"
bundled_data = "none (scenarios and predictions are synthetic, generated for this module)"
