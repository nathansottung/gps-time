# Module manifest (format: docs/modules/README.md; schema: schemas/manifest.v1.json).
# Loaded by gps_time_pi.modkit when the owner enables it ("modules_enabled" in
# the station config). Off by default. Demo: python -m gps_time_pi.modkit demo sdr-pps-marker

name = "sdr-pps-marker"
version = "0.1.0"
types = ["source"]
maturity = "research"
summary = "PPS time markers in SDR sample streams: detector, sub-sample interpolation and sample-to-UTC time model"
spec = "docs/specs/SPEC-SDR-PPS-MARKER.md"
research_step = 1   # synthetic only; bench steps 2-5 not started
interface = "1.0"

[entry]
source = "sdr_pps_marker.source:MarkerSource"

[hardware]
required = "none"   # step 1 runs on synthetic data
planned = "RTL-SDR-class receiver with the buffered, attenuated PPS injected at its input (spec: Physical build)"

[timing]
needed = "PPS on the station; the marker carries it into the samples"
if_worse = "with no markers, or too few, the time model has no time for the samples and reports state UNKNOWN"

[limits]
memory_mib = 256
cpu_percent = 50   # the demo computes in bursts; the share is measured over 60 s

[permissions]
network = false
devices = []
storage = "none"

[config]
fs_nominal = { type = "float", unit = "Hz", description = "SDR sample rate as set" }
pulse_width_s = { type = "float", unit = "s", default = 0.1, description = "PPS pulse width, to tell falling edges from markers" }
marker_delay_s = { type = "float", unit = "s", default = 0.0, description = "calibrated delay from the PPS edge to the marker in the samples" }
false_alarms_per_hour = { type = "float", default = 1.0, description = "detector threshold" }
ppm_limit = { type = "float", unit = "ppm", default = 200.0, description = "intervals further from nominal are flagged" }

[emits]
# Values in TimeModel.summary(), each with a provenance label.
streams = ["markers", "markers_per_minute", "sample_rate_hz", "clock_error_ppm", "drift_ppm_per_hour",
           "marker_position_sd_samples", "sample_time_uncertainty_s", "dropped_sample_events"]
events = ["samples_missing", "samples_extra"]
time_source = "pps_marker"
schema_version = "0"   # schemas come with the observation format (OBSF order 1)

[licence]
code = "MIT"
bundled_data = "none (fixtures are synthetic, generated by this module)"
