# Drop-in for gps-time-modules.service, installed by scripts/sdr-stack.sh (GTP_SDR=1) as
# /etc/systemd/system/gps-time-modules.service.d/gps-time-sdr.conf.
# The module service may reach the loopback address (rtl_tcp on 127.0.0.1:1234 for
# sdr-pps-marker) and nothing else: IPAddressDeny=any in the unit still applies to every other
# address. A module also needs network = true in its manifest; the permission guard enforces it.
# reference-adsb needs no drop-in: it only reads /run/readsb and /run/skyaware978.
[Service]
IPAddressAllow=localhost
