# Installed by scripts/feeders.sh (GTP_FEEDERS_PIAWARE=1) as
# /etc/systemd/system/piaware.service.d/gps-time.conf.
# PiAware runs only after the owner turned it on in Administration (admin token and a typed
# confirmation). Before each start, the helper applies the station's settings: PiAware reads
# readsb's Beast output on 127.0.0.1:30005, never gpsd (use-gpsd no), no automatic or remote
# updates, and MLAT only if the owner opted in separately (and never in hidden privacy mode).
[Unit]
ConditionPathExists=/opt/gps-time-pi/feeders/piaware.on

[Service]
ExecStartPre=+/usr/local/lib/gps-time-sdr/piaware-settings
