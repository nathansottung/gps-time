# EMERGENCY ROLLBACK drop-in: run gps-time-pi as root again, without the
# systemd hardening, while keeping the current code (including the admin token
# checks). Use only if the unprivileged service fails after an upgrade;
# see docs/development/raspberry-pi-deploy.md, "Rollback".
#
# Enable:  sudo install -D -m 0644 /opt/gps-time-pi/rollback/gps-time-pi-root-rollback.conf \
#              /etc/systemd/system/gps-time-pi.service.d/zz-root-rollback.conf
#          sudo systemctl daemon-reload && sudo systemctl restart gps-time-pi
# Undo:    sudo rm /etc/systemd/system/gps-time-pi.service.d/zz-root-rollback.conf
#          sudo systemctl daemon-reload && sudo systemctl restart gps-time-pi
#
# Every privilege/hardening setting in gps-time-pi.service is reset here
# (tests/test_admin_auth.py keeps the two files in sync). An empty value
# resets a list setting; User= empty means root.
[Service]
User=
Group=
SupplementaryGroups=
AmbientCapabilities=
CapabilityBoundingSet=
NoNewPrivileges=no
ProtectSystem=no
ReadWritePaths=
ProtectHome=no
PrivateTmp=no
ProtectClock=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
LockPersonality=no
SystemCallArchitectures=
UMask=0022
