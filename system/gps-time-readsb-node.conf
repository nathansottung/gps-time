# Installed by scripts/node.sh (GTP_NODE=1) on an SDR node as
# /etc/systemd/system/gps-time-readsb.service.d/gps-time-node.conf, with @ADDR@ = the station's address.
# readsb decodes as before and serves Beast on port 30005 to this Pi (the feeders, PiAware) and the
# station only. Still no other port and no position. Named after gps-time-feed.conf, so this
# ExecStart is the one systemd uses when both are installed.
[Service]
ExecStart=
ExecStart=/usr/bin/readsb --quiet --device-type rtlsdr --device ${GTP_SDR_1090_SERIAL} --gain -10   --write-json /run/readsb --write-json-every 1 --json-location-accuracy 0   --net --net-bind-address 0.0.0.0 --net-bo-port 30005 --net-ri-port 0 --net-ro-port 0 --net-sbs-port 0 --net-bi-port 0
IPAddressAllow=localhost @ADDR@
RestrictAddressFamilies=AF_INET AF_INET6
