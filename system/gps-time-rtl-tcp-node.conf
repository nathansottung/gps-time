# Installed by scripts/node.sh (GTP_NODE=1) on an SDR node as
# /etc/systemd/system/gps-time-rtl-tcp.service.d/gps-time-node.conf, with @ADDR@ = the station's address.
# rtl_tcp listens on the LAN, and only this Pi and the station can reach it.
[Service]
ExecStart=
ExecStart=/usr/bin/rtl_tcp -a 0.0.0.0 -p 1234 -s 2400000 -d ${GTP_SDR_PPS_SERIAL}
IPAddressAllow=@ADDR@
