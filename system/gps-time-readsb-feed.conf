# Installed by scripts/feeders.sh (GTP_FEEDERS=1) as
# /etc/systemd/system/gps-time-readsb.service.d/gps-time-feed.conf.
# readsb keeps decoding exactly as before and adds one output: Beast on 127.0.0.1:30005, which
# the feeder units (gps-time-feed@.service) and PiAware read. Nothing listens on another address,
# every other readsb port stays closed, and readsb can still reach no host but this one.
# Still no --lat/--lon: readsb is never given the station's position.
[Service]
ExecStart=
ExecStart=/usr/bin/readsb --quiet --device-type rtlsdr --device ${GTP_SDR_1090_SERIAL} --gain -10   --write-json /run/readsb --write-json-every 1 --json-location-accuracy 0   --net --net-bind-address 127.0.0.1 --net-bo-port 30005 --net-ri-port 0 --net-ro-port 0 --net-sbs-port 0 --net-bi-port 0
IPAddressAllow=localhost
RestrictAddressFamilies=AF_INET AF_INET6
