# Installed by scripts/websdr.sh as /etc/openwebrx/openwebrx.conf.d/gps-time.conf.
# OpenWebRX+ listens on the loopback only; the LAN reaches it through the password gate
# (gps-time-websdr-gate.service), which listens on GTP_WEBSDR_PORT (8073 by default).
[web]
port = 8074
bind_address = 127.0.0.1
ipv6 = false
